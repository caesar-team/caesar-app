[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Proprietary"

[workspace.dependencies]
argon2 = { version = "0.5", default-features = false, features = ["alloc"] }
chacha20poly1305 = { version = "0.10", default-features = false, features = ["alloc"] }
# `zeroize` приходит из default-фич x25519-dalek, но именно на нём держится
# затирание клэмпнутого ключа в `StaticSecret`. Задача 11 будет резать wasm-бандл
# через `default-features = false` — фича перечислена явно, чтобы это не выключило
# зачистку молча: ни один тест такого не заметит.
x25519-dalek = { version = "2", features = ["static_secrets", "zeroize"] }
hkdf = "0.12"
sha2 = { version = "0.10", default-features = false }
zeroize = { version = "1.8", features = ["derive"] }
rand_core = { version = "0.6", features = ["getrandom"] }
getrandom = "0.2"
unicode-normalization = "0.1.25"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"
thiserror = "2"
uniffi = "0.32"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

# Тесты выводят ключи на продакшн-параметрах Argon2id (m=64 MiB, t=3).
# В debug-сборке неоптимизированный argon2 делает это на порядки медленнее,
# поэтому оптимизируем сам крейт даже в dev-профиле.
[profile.dev.package.argon2]
opt-level = 3
[profile.dev.package.blake2]
opt-level = 3
